<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Between the Spines — 读书记录</title>
  <script src="books.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap');

    :root {
      --bg: #e8edf2;
      --bg-grad-end: #dde5ec;
      --text: #111;
      --text-muted: rgba(17, 17, 17, 0.55);
      --panel: rgba(255, 255, 255, 0.82);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', 'PingFang SC', sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-grad-end) 100%);
      color: var(--text);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 顶部角标 */
    .corner {
      position: absolute;
      top: 42px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      line-height: 1.6;
      z-index: 20;
    }
    .corner-left { left: 48px; }
    .corner-right { right: 48px; text-align: right; }
    .corner .line2 { opacity: 0.8; }

    /* 标题 */
    .header {
      position: absolute;
      top: 16vh;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .title {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: clamp(52px, 8vw, 130px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.03em;
    }

    /* 书架场景 */
    .shelf-scene {
      position: relative;
      width: 100%;
      height: 56vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 60px 8vh;
      perspective: 1400px;
      overflow: hidden;
    }

    .shelf-track {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      transform-style: preserve-3d;
      padding-bottom: 10px;
    }

    /* 单本书 */
    .book-wrap {
      position: relative;
      flex-shrink: 0;
      width: var(--spine-w, 44px);
      height: var(--book-h, 230px);
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  margin 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      transform: rotateZ(var(--tilt, 0deg));
      cursor: pointer;
    }

    .book-wrap:hover {
      z-index: 50;
      margin-right: calc(var(--cover-w, 150px) - var(--spine-w, 44px) + 18px);
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* 书脊 */
    .spine {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--book-color, #3a5a78);
      border-radius: 5px 3px 3px 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow:
        inset -2px 0 6px rgba(0,0,0,0.12),
        inset 2px 0 4px rgba(255,255,255,0.15),
        3px 6px 14px rgba(0,0,0,0.12);
      z-index: 2;
    }

    .spine::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(255,255,255,0.18), transparent 35%, rgba(0,0,0,0.08));
      pointer-events: none;
    }

    .spine-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: clamp(10px, 1.2vw, 13px);
      font-weight: 600;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.96);
      padding: 18px 0;
      max-height: 86%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0,0,0,0.18);
    }

    /* 书脊上的装饰圆点 */
    .spine-dot {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.45);
      border-radius: 50%;
    }

    /* 封面（可翻开） */
    .cover {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--cover-w, 150px);
      height: 100%;
      transform-origin: left center;
      transform: rotateY(-92deg);
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border-radius: 3px 5px 5px 3px;
      overflow: hidden;
      box-shadow:
        8px 12px 30px rgba(0,0,0,0.18),
        0 0 0 1px rgba(0,0,0,0.04);
      backface-visibility: hidden;
      z-index: 3;
      background: var(--book-color, #3a5a78);
    }

    .book-wrap:hover .cover {
      transform: rotateY(0deg);
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover.no-cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      color: rgba(255,255,255,0.92);
    }

    .cover.no-cover .c-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .cover.no-cover .c-author {
      font-size: 11px;
      opacity: 0.85;
    }

    /* 书页边缘（厚度） */
    .pages {
      position: absolute;
      left: 0;
      top: 3px;
      bottom: 3px;
      width: var(--cover-w, 150px);
      background: linear-gradient(180deg, #fdfbf7 0%, #f0ebe2 50%, #e8e2d6 100%);
      transform-origin: left center;
      transform: rotateY(-92deg) translateZ(-2px);
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.05);
      z-index: 1;
    }

    .book-wrap:hover .pages {
      transform: rotateY(0deg) translateZ(-2px);
    }

    /* 书籍倒影 */
    .book-shadow {
      position: absolute;
      bottom: -28px;
      left: -15%;
      width: 130%;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.16) 0%, transparent 70%);
      filter: blur(5px);
      pointer-events: none;
      z-index: -1;
    }

    /* 底部提示 */
    .footer-hint {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      animation: pulse 2.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }

    /* 详情浮层 */
    .info-card {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(130%);
      width: min(520px, 88vw);
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 16px;
      padding: 22px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.1);
      z-index: 100;
      opacity: 0;
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .info-card.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .info-card h3 {
      font-family: 'Noto Serif SC', 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .info-card .meta {
      font-size: 11px;
      color: #555;
      margin-bottom: 8px;
    }

    .info-card .desc {
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .corner { top: 22px; font-size: 8px; }
      .corner-left { left: 20px; }
      .corner-right { right: 20px; }
      .header { top: 13vh; }
      .title { font-size: clamp(38px, 12vw, 80px); }
      .shelf-scene { padding: 0 20px 6vh; height: 58vh; }
      .shelf-track { gap: 6px; }
      .book-wrap { --book-h: 170px; --spine-w: 34px; --cover-w: 110px; }
      .spine-text { font-size: 10px; }
      .book-wrap:hover { margin-right: calc(var(--cover-w, 110px) - var(--spine-w, 34px) + 10px); }
      .info-card { padding: 16px 20px; bottom: 58px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="corner corner-left">
      <div>Reading Archive</div>
      <div class="line2">Jul 2026</div>
    </div>
    <div class="corner corner-right">
      <div id="bookCount">33 Books</div>
    </div>

    <header class="header">
      <div class="eyebrow">Personal Collection</div>
      <h1 class="title">Between the Spines</h1>
    </header>

    <div class="shelf-scene" id="scene">
      <div class="shelf-track" id="track">
        <!-- 书籍由 JS 注入 -->
      </div>
    </div>

    <div class="info-card" id="infoCard">
      <h3 id="infoTitle">书名</h3>
      <div class="meta" id="infoMeta">作者 · 出版社 · 年份</div>
      <div class="desc" id="infoDesc">内容简介</div>
    </div>

    <div class="footer-hint">Hover to open</div>
  </div>

  <script>
    const PALETTE = [
      '#c94a4a', '#2f4f6f', '#d4a017', '#5d7a5d', '#8b5a6b',
      '#3a5a78', '#e07a5f', '#4a4a4a', '#8fa39a', '#b56576',
      '#6b5b95', '#88b04b', '#f7cac9', '#92a8d1', '#955251',
      '#7c9473', '#9a8b4f', '#6e8898', '#a05f6d', '#5e8b7e',
      '#c9a227', '#5a7d9a', '#8c6b5d', '#6b8c5a', '#9a6b8c'
    ];

    const track = document.getElementById('track');
    const infoCard = document.getElementById('infoCard');
    const infoTitle = document.getElementById('infoTitle');
    const infoMeta = document.getElementById('infoMeta');
    const infoDesc = document.getElementById('infoDesc');

    function getColor(str, idx) {
      if (!str) return PALETTE[idx % PALETTE.length];
      let hash = 0;
      for (let c of str) hash = c.charCodeAt(0) + ((hash << 5) - hash);
      return PALETTE[Math.abs(hash) % PALETTE.length];
    }

    BOOKS.forEach((book, idx) => {
      const isUnrecognized = book.status === 'unrecognized';
      const hasCover = !isUnrecognized && book.cover && book.cover.length > 10 && !book.cover.includes('book-default');
      const color = getColor(book.title, idx);
      const spineW = 40 + (idx % 6) * 3;
      const bookH = 215 + (idx % 7) * 18;
      const coverW = 145 + (idx % 5) * 10;
      const tilt = (idx % 2 === 0 ? -1 : 1) * (1 + (idx % 4) * 0.4);

      const wrap = document.createElement('div');
      wrap.className = 'book-wrap';
      wrap.style.setProperty('--spine-w', spineW + 'px');
      wrap.style.setProperty('--book-h', bookH + 'px');
      wrap.style.setProperty('--cover-w', coverW + 'px');
      wrap.style.setProperty('--book-color', color);
      wrap.style.setProperty('--tilt', tilt + 'deg');

      const spineLabel = isUnrecognized ? '待确认' : book.title;
      const coverTitle = isUnrecognized ? '待确认书目' : book.title;

      wrap.innerHTML = `
        <div class="book">
          <div class="spine">
            <div class="spine-text">${spineLabel}</div>
            <div class="spine-dot"></div>
          </div>
          <div class="pages"></div>
          <div class="cover ${hasCover ? '' : 'no-cover'}">
            ${hasCover
              ? `<img src="${book.cover}" alt="${book.title}" loading="lazy" onerror="this.parentElement.classList.add('no-cover'); this.remove();">`
              : `<div class="c-title">${coverTitle}</div><div class="c-author">${book.author || ''}</div>`
            }
          </div>
          <div class="book-shadow"></div>
        </div>
      `;

      wrap.addEventListener('mouseenter', () => showInfo(book));
      wrap.addEventListener('mouseleave', hideInfo);
      wrap.addEventListener('touchstart', () => showInfo(book), {passive: true});

      track.appendChild(wrap);
    });

    document.getElementById('bookCount').textContent = `${BOOKS.length} Books`;

    let hideTimer;
    function showInfo(book) {
      clearTimeout(hideTimer);
      infoTitle.textContent = book.title;
      infoMeta.textContent = [book.author, book.publisher, book.year].filter(Boolean).join(' · ');
      infoDesc.textContent = book.summary || '暂无简介';
      infoCard.classList.add('active');
    }

    function hideInfo() {
      hideTimer = setTimeout(() => infoCard.classList.remove('active'), 400);
    }
  </script>
</body>
</html>
